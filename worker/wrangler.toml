name = "mohini-artistry-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
FRONTEND_ORIGIN = "https://mohini-artistry.pages.dev"
RAZORPAY_KEY_ID = "rzp_test_placeholder"
R2_PUBLIC_BASE_URL = "https://pub-79e3bfd0301940fb92417ea2d904b76c.r2.dev"

[[d1_databases]]
binding = "DB"
database_name = "mohini-artistry-db"
database_id = "57eb3222-c3a3-4f14-b6de-065026e915f5"

[[r2_buckets]]
binding = "PRODUCT_IMAGES"
bucket_name = "mohini-artistry-product-images"

# Secrets (never stored here — set via `wrangler secret put NAME`):
#   JWT_SECRET
#   RAZORPAY_KEY_SECRET
#   RAZORPAY_WEBHOOK_SECRET

[env.production.vars]
FRONTEND_ORIGIN = "https://mohini-artistry.pages.dev"
RAZORPAY_KEY_ID = "rzp_test_placeholder"
R2_PUBLIC_BASE_URL = "https://pub-79e3bfd0301940fb92417ea2d904b76c.r2.dev"

[[env.production.d1_databases]]
binding = "DB"
database_name = "mohini-artistry-db"
database_id = "57eb3222-c3a3-4f14-b6de-065026e915f5"

[[env.production.r2_buckets]]
binding = "PRODUCT_IMAGES"
bucket_name = "mohini-artistry-product-images"
